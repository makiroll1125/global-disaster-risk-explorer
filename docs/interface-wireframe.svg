<rect x="882" y="718" width="202" height="62" class="soft"/><text x="895" y="742" class="small">Finding / data notes</text><text x="895" y="762" class="small">Inspect records</text>
<text x="35" y="834" class="small">Linking: filters → all views. Country selection keeps map/ranking context. Brushing keeps the full timeline visible.</text>
<text x="35" y="856" class="small">Keyboard alternatives: native country and year selectors; focusable map, bars and annual points.</text>
