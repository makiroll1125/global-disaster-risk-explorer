<g fill="#92bfb6"><rect x="550" y="458" width="209" height="12"/><rect x="550" y="481" width="173" height="12"/><rect x="550" y="504" width="141" height="12"/><rect x="550" y="527" width="104" height="12"/><rect x="550" y="550" width="79" height="12"/></g><text x="549" y="582" class="small">Select a bar → shared filters</text>
