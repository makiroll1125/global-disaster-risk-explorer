<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="880" viewBox="0 0 1140 880" role="img" aria-labelledby="title desc">
<title id="title">Global Disaster Risk Explorer interface wireframe</title><desc id="desc">A desktop layout places filters and summary cards above a map and ranking, followed by a linked timeline. A mobile layout stacks these sections. Annotations explain shared filters and contextual views.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#29454e}.small{font-size:12px;fill:#60757c}.label{font-size:13px;font-weight:bold}.wire{fill:#fff;stroke:#a7bab8;stroke-width:1.2}.soft{fill:#eaf2ef;stroke:#b9cec6}.dash{fill:none;stroke:#9aaeb0;stroke-dasharray:5 4}</style></defs>
<rect width="1140" height="880" fill="#f5f7f6"/>
<text x="35" y="40" font-size="23" font-weight="bold">Global Disaster Risk Explorer / interface wireframe</text>
<text x="35" y="64" class="small">Interim design · light interface · linked overview, comparison and temporal exploration</text>
<text x="35" y="101" class="label">DESKTOP</text><text x="865" y="101" class="label">MOBILE</text>
<rect x="35" y="117" width="780" height="685" rx="8" class="wire"/>
<rect x="55" y="134" width="740" height="32" class="soft"/><text x="68" y="154" class="small">IDENTITY</text><text x="575" y="154" class="small">Explorer · About the data</text>
<text x="57" y="202" font-size="24" font-weight="bold">A world of hazards. Unequal impacts.</text>
<text x="57" y="225" class="small">Question and purpose: compare recorded frequency and reported consequences.</text>
<rect x="55" y="243" width="740" height="46" rx="3" class="wire"/>
