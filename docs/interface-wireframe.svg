<rect x="882" y="379" width="202" height="113" class="wire"/><text x="895" y="405" class="label">01 / Map</text><ellipse cx="981" cy="449" rx="77" ry="28" class="soft"/>
<rect x="882" y="506" width="202" height="93" class="wire"/><text x="895" y="533" class="label">02 / Ranking</text><path d="M897 551H1061 M897 565H1029 M897 579H1000" stroke="#92bfb6" stroke-width="8"/>
