<text x="58" y="308" class="small">Current scope and selected period</text><text x="661" y="308" class="small">2026 is partial</text>
<g class="soft"><rect x="55" y="322" width="175" height="52"/><rect x="243" y="322" width="175" height="52"/><rect x="431" y="322" width="175" height="52"/><rect x="619" y="322" width="176" height="52"/></g>
<text x="68" y="343" class="label">Records</text><text x="68" y="361" class="small">Countries in selection</text><text x="256" y="343" class="label">Deaths</text><text x="256" y="361" class="small">Reporting coverage</text><text x="444" y="343" class="label">Affected</text><text x="444" y="361" class="small">Reporting coverage</text><text x="632" y="343" class="label">Adjusted damage</text><text x="632" y="361" class="small">Coverage · 2025 USD</text>
